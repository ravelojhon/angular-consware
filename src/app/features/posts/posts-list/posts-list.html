<div class="posts-list-container">
  <mat-card>
    <mat-card-header>
      <div class="card-header-content">
        <div class="title-section">
          <mat-card-title>
            <mat-icon>article</mat-icon>
            Lista de Posts
          </mat-card-title>
          <mat-card-subtitle>Gestión de publicaciones (mostrando 10 posts)</mat-card-subtitle>
        </div>
        <div class="header-actions">
          <button mat-icon-button (click)="refreshPosts()" matTooltip="Refrescar lista">
            <mat-icon>refresh</mat-icon>
          </button>
          <button mat-icon-button (click)="createPost()" matTooltip="Crear nuevo post" color="primary">
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </div>
    </mat-card-header>
    
    <mat-card-content>
      <!-- Loading spinner -->
      <div *ngIf="loading" class="loading-container">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Cargando posts...</p>
      </div>

      <!-- Posts table -->
      <div *ngIf="!loading && dataSource.length > 0" class="table-container">
        <table mat-table [dataSource]="dataSource" class="posts-table">
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let post">
              <span class="post-id">{{ post.id }}</span>
            </td>
          </ng-container>

          <!-- Title Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Título</th>
            <td mat-cell *matCellDef="let post">
              <div class="post-title">
                {{ post.title | slice:0:50 }}{{ post.title.length > 50 ? '...' : '' }}
              </div>
            </td>
          </ng-container>

          <!-- User ID Column -->
          <ng-container matColumnDef="userId">
            <th mat-header-cell *matHeaderCellDef>Usuario</th>
            <td mat-cell *matCellDef="let post">
              <span class="user-id">User {{ post.userId }}</span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let post">
              <div class="actions-container">
                <button mat-icon-button 
                        color="primary" 
                        (click)="viewPost(post)"
                        matTooltip="Ver detalles">
                  <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button 
                        color="accent" 
                        (click)="editPost(post)"
                        matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button 
                        color="warn" 
                        (click)="deletePost(post)"
                        matTooltip="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
              class="post-row"></tr>
        </table>
      </div>

      <!-- Empty state -->
      <div *ngIf="!loading && dataSource.length === 0" class="empty-state">
        <mat-icon>inbox</mat-icon>
        <p>No hay posts disponibles</p>
        <button mat-raised-button color="primary" (click)="loadPosts()">
          <mat-icon>refresh</mat-icon>
          Recargar
        </button>
      </div>

      <!-- Loading overlay for table -->
      <div *ngIf="loading && dataSource.length > 0" class="loading-overlay">
        <mat-spinner diameter="30"></mat-spinner>
        <span>Actualizando...</span>
      </div>
    </mat-card-content>
  </mat-card>
</div>
